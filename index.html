<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web ePub Creator Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip for ePub Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Quill.js Rich Text Editor CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <style>
        /* Quill Editor UI Customization */
        .ql-toolbar.ql-snow { background-color: #f3f4f6; color: #111; border-top-left-radius: 0.5rem; border-top-right-radius: 0.5rem; }
        .bg-gray-900 .ql-toolbar.ql-snow { background-color: #374151; border-color: #4b5563; }
        .bg-gray-900 .ql-toolbar .ql-stroke { stroke: #e5e7eb; }
        .bg-gray-900 .ql-toolbar .ql-fill { fill: #e5e7eb; }
        .bg-gray-900 .ql-toolbar .ql-picker { color: #e5e7eb; }
        .ql-container.ql-snow { border-bottom-left-radius: 0.5rem; border-bottom-right-radius: 0.5rem; }
        .bg-gray-900 .ql-container.ql-snow { background-color: #1f2937; border-color: #4b5563; }
        
        /* FIXED: ဗီဒီယိုထဲကအတိုင်း စာရိုက်ကွက်ကို စာရှိသလောက် အောက်ကို လိုက်ဆန့်ပေးမည့်ပုံစံ */
        .ql-editor { 
            min-height: 200px;         /* စာမရှိရင် အနည်းဆုံး ဒီလောက်အမြင့် ရှိနေပါမယ် */
            height: auto !important;    /* စာရိုက်ရင် ရိုက်သလောက် အောက်ကို အလိုအလျောက် ရှည်ဆင်းသွားပါမယ် */
            overflow-y: visible !important; /* စာရိုက်ကွက်ထဲမှာ သီးသန့် scroll ဘား မပေါ်စေဘဲ web စာမျက်နှာတစ်ခုလုံးနဲ့ လိုက်ပါသွားပါမယ် */
            line-height: 1.6; 
        }
        
        .ql-editor img { max-width: 100%; height: auto; display: block; margin: 10px auto; }
        /* Active Chapter Highlight */
        .active-chapter { background-color: #3b82f6 !important; color: white !important; }
    </style>
</head>
<body id="bodyTag" class="bg-gray-900 text-gray-100 min-h-screen p-4 flex flex-col items-center">

    <!-- Main Container -->
    <div id="mainContainer" class="w-full max-w-md bg-gray-800 rounded-xl p-6 shadow-2xl space-y-6 border border-gray-750">
        
        <!-- Header Controls -->
        <div class="flex items-center justify-between">
            <button id="themeBtn" class="px-3 py-1.5 bg-gray-700 hover:bg-gray-600 rounded-lg text-xs font-semibold transition shadow">☀️ Light Mode</button>
            <button id="authBtn" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold transition shadow">Sign In</button>
        </div>

        <!-- Auth Section (Hidden by default) -->
        <div id="authSection" class="hidden bg-gray-850 p-4 border border-gray-700 rounded-lg space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-sm font-bold text-blue-400">Firebase Cloud Sync</span>
                <button id="closeAuth" class="text-gray-400 hover:text-white font-bold">&times;</button>
            </div>
            <input type="email" id="emailInput" placeholder="Email" class="w-full p-2 text-sm bg-gray-900 border border-gray-700 rounded focus:outline-none focus:border-blue-500">
            <input type="password" id="passwordInput" placeholder="Password" class="w-full p-2 text-sm bg-gray-900 border border-gray-700 rounded focus:outline-none focus:border-blue-500">
            <div class="flex space-x-2">
                <button id="signInSubmit" class="flex-1 py-1.5 bg-emerald-600 text-xs font-bold rounded hover:bg-emerald-500">Sign In</button>
                <button id="signUpSubmit" class="flex-1 py-1.5 bg-gray-700 text-xs font-bold rounded hover:bg-gray-600">Sign Up</button>
            </div>
            <div id="userInfoStatus" class="hidden text-xs text-gray-400 pt-1 border-t border-gray-700">
                Logged in as: <span id="userEmailDisplay" class="text-emerald-400 font-mono"></span>
            </div>
        </div>

        <!-- Backup & Reset Section -->
        <div id="backupBox" class="border border-gray-700 rounded-lg p-4 space-y-3 bg-gray-850">
            <button id="btnBackup" class="w-full py-2 bg-gradient-to-r Kahn from-slate-700 to-slate-600 text-white font-medium rounded-lg shadow text-sm transition hover:brightness-110 flex items-center justify-center space-x-2">
                <span>💾 စာအုပ် BACKUP ဖိုင်သိမ်းဆည်းမည်</span>
            </button>
            <div class="flex space-x-2">
                <button id="btnLoadBackup" class="flex-1 py-2 bg-indigo-700 text-white text-xs font-medium rounded-lg shadow transition hover:bg-indigo-600 flex items-center justify-center space-x-1">
                    <span>📤 ဖိုင်ဟောင်း ပြန်တင်မည် (Load Backup)</span>
                </button>
                <input type="file" id="fileInput" accept=".json" class="hidden">
                <button id="btnReset" class="flex-1 py-2 bg-rose-900 text-rose-100 text-xs font-medium rounded-lg shadow transition hover:bg-rose-800 flex items-center justify-center space-x-1">
                    <span>🔄 စာအုပ်အသစ်အတွက် အစကပြန်စမည် (Reset)</span>
                </button>
            </div>
        </div>

        <!-- Book Meta Form -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">စာအုပ်အမည် (Book Title)</label>
                <input type="text" id="bookTitle" placeholder="စာအုပ်ခေါင်းစဉ် ရိုက်ထည့်ပါ..." class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 shadow-inner">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">စာရေးဆရာ (Author)</label>
                <input type="text" id="bookAuthor" placeholder="စာရေးဆရာအမည်..." class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 shadow-inner">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">မျက်နှာဖုံးပုံ (Cover Image)</label>
                <input type="file" id="coverInput" accept="image/*" class="w-full text-xs text-gray-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-gray-750 file:text-gray-200 hover:file:bg-gray-700">
                <img id="coverPreview" src="" alt="Cover Preview" class="hidden mt-3 max-w-[120px] max-height-[160px] rounded shadow-lg border border-gray-700 mx-auto">
            </div>
        </div>

        <!-- Chapters Workspace -->
        <div class="space-y-3 pt-2 border-t border-gray-750">
            <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold text-gray-300 uppercase tracking-wide">အခန်းများ (Chapters)</h3>
                <button id="btnAddChapter" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-md transition shadow flex items-center space-x-1">
                    <span>+ အခန်းတိုးမည် (Add Chapter)</span>
                </button>
            </div>
            
            <!-- Dynamic Chapters Container -->
            <div id="chaptersListContainer" class="space-y-2 max-height-[180px] overflow-y-auto pr-1"></div>
        </div>

        <!-- Active Rich Editor Section -->
        <div id="activeEditorSection" class="hidden space-y-3 pt-4 border-t border-gray-750 animate-fadeIn">
            <!-- PDF Upload Utility Inside Active Chapter -->
            <div class="bg-gray-850 p-3 border border-gray-700 rounded-lg space-y-2">
                <label class="block text-xs font-bold text-purple-400 uppercase tracking-wide">📄 PDF မှ စာသားထုတ်ယူရန် (Optional)</label>
                <div class="flex items-center space-x-2">
                    <input type="file" id="pdfFileInput" accept=".pdf" class="block w-full text-xs text-gray-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:bg-purple-900 file:text-purple-200 hover:file:bg-purple-800">
                    <button id="btnExtractPdf" class="px-3 py-1 bg-purple-700 hover:bg-purple-600 text-white text-xs font-bold rounded transition shadow shrink-0">⚡ PDF မှ စာသားရယူမည်</button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">အခန်းခေါင်းစဉ် (Chapter Title)</label>
                <input type="text" id="activeChTitle" placeholder="အခန်းခေါင်းစဉ်..." class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm font-medium focus:outline-none focus:border-blue-500 shadow-inner">
            </div>
            
            <div class="flex justify-between items-center">
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-400">အခန်းတွင်းစာသား (Chapter Content)</label>
                <button id="btnClearContent" class="text-xxs text-rose-400 hover:text-rose-300 font-semibold flex items-center space-x-1">
                    <span>🧹 စာသားအားလုံးဖျက်ရန် (Clear All Content)</span>
                </button>
            </div>
            
            <!-- Global Quill Container -->
            <div class="bg-gray-900 rounded-lg overflow-hidden shadow-inner border border-gray-700">
                <div id="editor"></div>
            </div>
        </div>

        <!-- Submit Output Button -->
        <button id="btnGenerate" class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-bold rounded-xl shadow-lg transition hover:brightness-110 active:scale-[0.99] text-sm tracking-wide flex items-center justify-center space-x-2">
            <span>💾 ePub ဖိုင် ထုတ်ယူမည်</span>
        </button>

    </div>

    <!-- Quill.js Core Library Script -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <!-- Application Script Reference -->
    <script src="app.js"></script>
    <!-- PDF.js Core Library for Text Extraction Infrastructure -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="pdf-handler.js"></script>
</body>
</html>
