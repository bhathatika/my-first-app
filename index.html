<!-- ========================================================================= -->
<!-- 🌟 UI CUSTOMIZE BAR (NIGHT MODE & LANGUAGE) - အန္တရာယ်ကင်း သီးသန့်စနစ် -->
<!-- ========================================================================= -->
<div class="settings-bar" style="display: flex; justify-content: flex-end; gap: 10px; padding: 10px; background: inherit;">
    <!-- ဘာသာစကား ရွေးချယ်ရန် Dropdown -->
    <select id="lang-select" onchange="changeAppLanguage()" style="padding: 6px 12px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; font-family: sans-serif;">
        <option value="my">မြန်မာဘာသာ</option>
        <option value="en">English</option>
    </select>
    
    <!-- Night Mode ဖွင့်/ပိတ် ခလုတ် -->
    <button id="theme-toggle" onclick="toggleAppTheme()" style="padding: 6px 12px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; font-family: sans-serif; background-color: #f0f0f0; color: #333;">
        🌙 Night Mode
    </button>
</div>

<!-- 🌙 Night Mode အတွက် စတိုင်လ်အသစ် (မူလ UI Layout များ လုံးဝ မပျောက်စေရန် ပြင်ဆင်ပြီး) -->
<style>
body.dark-mode {
    background-color: #121212 !important;
    color: #e0e0e0 !important;
}

/* စာသားရိုက်သည့်နေရာနှင့် Input များကိုသာ အရောင်ပြောင်းခြင်း */
body.dark-mode input, 
body.dark-mode textarea, 
body.dark-mode select {
    background-color: #2d2d2d !important;
    color: #ffffff !important;
    border: 1px solid #444444 !important;
}

/* ခလုတ်များကိုသာ အရောင်ပြောင်းခြင်း */
body.dark-mode button, 
body.dark-mode .btn {
    background-color: #333333 !important;
    color: #ffffff !important;
    border: 1px solid #555555 !important;
}

body.dark-mode #theme-toggle {
    background-color: #444444 !important;
    color: #ffffff !important;
}
</style>

<!-- 🧠 Night Mode နှင့် Language အတွက် သီးသန့် JavaScript (app.js ကို လုံးဝမထိခိုက်စေပါ) -->
<script>
function toggleAppTheme() {
    const body = document.body;
    const btn = document.getElementById('theme-toggle');
    body.classList.toggle('dark-mode');
    
    if (body.classList.contains('dark-mode')) {
        btn.innerText = "☀️ Light Mode";
        localStorage.setItem('app_theme', 'dark');
    } else {
        btn.innerText = "🌙 Night Mode";
        localStorage.setItem('app_theme', 'light');
    }
}

function changeAppLanguage() {
    const lang = document.getElementById('lang-select').value;
    localStorage.setItem('app_lang', lang);
    
    const bookTitleInput = document.getElementById('book-title');
    const authorInput = document.getElementById('author');
    const allButtons = document.querySelectorAll('button');
    
    if (lang === 'en') {
        if (bookTitleInput) bookTitleInput.placeholder = "Book Title";
        if (authorInput) authorInput.placeholder = "Author Name";
        
        allButtons.forEach(btn => {
            if (btn.innerText.includes("အခန်းတိုးမည်")) btn.innerText = "+ Add Chapter";
            if (btn.innerText.includes("ePub ဖိုင် ထုတ်ယူမည်") || btn.innerText.includes("ePub ဖိုင်ထုတ်မည်")) btn.innerText = "📩 Export ePub";
            if (btn.innerText.includes("Backup")) btn.innerText = "💾 Save Backup";
        });
    } else {
        if (bookTitleInput) bookTitleInput.placeholder = "စာအုပ်အမည် (Book Title)";
        if (authorInput) authorInput.placeholder = "စာရေးဆရာ (Author)";
        
        allButtons.forEach(btn => {
            if (btn.innerText.includes("Add Chapter")) btn.innerText = "+ အခန်းတိုးမည်";
            if (btn.innerText.includes("Export ePub")) btn.innerText = "📩 ePub ဖိုင် ထုတ်ယူမည်";
            if (btn.innerText.includes("Save Backup")) btn.innerText = "💾 Backup ဖိုင်သိမ်းမည်";
        });
    }
}

window.addEventListener('load', () => {
    if (localStorage.getItem('app_theme') === 'dark') {
        document.body.classList.add('dark-mode');
        const btn = document.getElementById('theme-toggle');
        if (btn) btn.innerText = "☀️ Light Mode";
    }
    
    const savedLang = localStorage.getItem('app_lang');
    const langSelect = document.getElementById('lang-select');
    if (savedLang && langSelect) {
        langSelect.value = savedLang;
        changeAppLanguage();
    }
});
</script>
<!-- ========================================================================= -->
