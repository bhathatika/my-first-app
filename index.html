<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web ePub Creator Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip for ePub Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Quill.js Rich Text Editor CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        /* Quill Editor UI Customization */
        .ql-toolbar.ql-snow { background-color: #f3f4f6; border-top-left-radius: 0.5rem; border-top-right-radius: 0.5rem; }
        .bg-gray-900 .ql-toolbar.ql-snow { background-color: #374151; border-color: #4b5563; }
        .bg-gray-900 .ql-toolbar .ql-stroke { stroke: #e5e7eb; }
        .bg-gray-900 .ql-toolbar .ql-fill { fill: #e5e7eb; }
        .bg-gray-900 .ql-toolbar .ql-picker { color: #e5e7eb; }
        .ql-container.ql-snow { border-bottom-left-radius: 0.5rem; border-bottom-right-radius: 0.5rem; font-size: 15px; min-height: 300px; background-color: #fff; }
        .bg-gray-900 .ql-container.ql-snow { background-color: #0c1017; border-color: #4b5563; color: #f3f4f6; }
        .ql-editor { min-height: 300px; line-height: 1.7; }
        .ql-editor img { max-width: 100%; height: auto; display: block; margin: 12px auto; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        /* Active Chapter Highlight */
        .active-chapter { background-color: #3b82f6 !important; color: white !important; border-color: #2563eb !important; }
    </style>
</head>
<body id="bodyTag" class="bg-gray-900 text-gray-100 min-h-screen p-4 flex flex-col items-center">

    <div id="mainContainer" class="w-full max-w-md bg-gray-800 rounded-xl p-6 shadow-2xl space-y-6 border border-gray-750">
        
        <!-- Header -->
        <div class="flex justify-between items-center">
            <h1 class="text-xl font-bold text-emerald-400 flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></span>
                Web ePub Creator Pro
            </h1>
            <div class="flex gap-2">
                <button id="authBtn" class="bg-blue-600 hover:bg-blue-700 text-xs px-2.5 py-1.5 rounded font-bold transition">Sign In</button>
                <button id="themeBtn" class="bg-gray-700 hover:bg-gray-600 text-xs px-2.5 py-1.5 rounded font-bold transition">☀️ Light Mode</button>
            </div>
        </div>

        <!-- User Info Status -->
        <div id="userInfoStatus" class="hidden bg-gray-900/50 border border-gray-700 p-2 rounded text-xs flex justify-between items-center text-gray-400">
            <span>Logged in as: <b id="userEmailDisplay" class="text-emerald-400"></b></span>
        </div>

        <!-- Auth Section Modal -->
        <div id="authSection" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-5 w-full max-w-xs space-y-4 shadow-2xl">
                <div class="flex justify-between items-center border-b border-gray-700 pb-2">
                    <h3 class="text-sm font-bold text-white">Firebase Sync Account</h3>
                    <button id="closeAuth" class="text-gray-400 hover:text-white text-lg">&times;</button>
                </div>
                <input type="email" id="emailInput" placeholder="Email Address" class="w-full p-2 bg-gray-950 border border-gray-700 rounded text-xs text-white focus:outline-emerald-500">
                <input type="password" id="passwordInput" placeholder="Password" class="w-full p-2 bg-gray-950 border border-gray-700 rounded text-xs text-white focus:outline-emerald-500">
                <div class="grid grid-cols-2 gap-2 pt-2">
                    <button id="signInSubmit" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs py-2 rounded font-bold">Sign In</button>
                    <button id="signUpSubmit" class="bg-gray-700 hover:bg-gray-600 text-white text-xs py-2 rounded font-bold">Sign Up</button>
                </div>
            </div>
        </div>

        <!-- Backup Manager Box -->
        <div id="backupBox" class="border border-gray-700 rounded-lg p-4 space-y-3 bg-gray-850 shadow-inner">
            <div class="text-center text-xs font-bold text-gray-400 flex items-center justify-center gap-1">💾 စာအုပ် BACKUP စီမံခန့်ခွဲမှု</div>
            <button id="btnBackup" class="w-full bg-slate-700 hover:bg-slate-600 text-xs py-2.5 rounded font-bold flex items-center justify-center gap-1 transition shadow">
                📩 လက်ရှိစာအုပ်ကို ဖိုင်သိမ်းမည် (Backup)
            </button>
            <button id="btnLoadBackup" class="w-full bg-indigo-700 hover:bg-indigo-600 text-xs py-2.5 rounded font-bold flex items-center justify-center gap-1 transition shadow">
                📤 စာအုပ်ဟောင်း ပြန်တင်မည် (Load Backup)
            </button>
            <input type="file" id="fileInput" accept=".json" class="hidden">
            <button id="btnReset" class="w-full bg-rose-900/80 hover:bg-rose-900 text-xs py-2 rounded font-medium text-rose-200 transition">
                🧹 စာအုပ်အသစ်အတွက် အစကပြန်စမည် (Reset)
            </button>
        </div>

        <!-- Book Metadata -->
        <div class="space-y-3">
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1">စာအုပ်အမည် (Book Title)</label>
                <input type="text" id="bookTitle" placeholder="My Novel" class="w-full p-2.5 bg-gray-950 rounded border border-gray-700 text-sm text-white focus:outline-emerald-500 font-medium">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1">စာရေးဆရာ (Author)</label>
                <input type="text" id="bookAuthor" placeholder="Unknown Author" class="w-full p-2.5 bg-gray-950 rounded border border-gray-700 text-sm text-white focus:outline-emerald-500 font-medium">
            </div>
            <div class="space-y-1">
                <label class="block text-xs font-bold text-gray-400">မျက်နှာဖုံးပုံ (Cover Image)</label>
                <div class="flex items-center space-x-3 bg-gray-950 p-2 rounded border border-gray-700">
                    <input type="file" id="coverInput" accept="image/*" class="text-xs text-gray-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:bg-gray-700 file:text-white hover:file:bg-gray-650">
                    <img id="coverPreview" class="hidden w-12 h-16 object-cover rounded border border-gray-600 shadow-md">
                </div>
            </div>
        </div>

        <hr class="border-gray-700">

        <!-- Chapters Section -->
        <div class="space-y-3">
            <div class="flex flex-col space-y-2">
                <label class="block text-sm font-bold text-white">အခန်းများ (Chapters)</label>
                <button id="btnAddChapter" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-lg font-bold transition shadow flex items-center justify-center gap-1">
                    + အခန်းတိုးမည် (Add Chapter)
                </button>
            </div>
            
            <!-- အခန်းစာရင်းတွေ စီပြမယ့်နေရာ (Accordion/List) -->
            <div id="chaptersListContainer" class="space-y-1.5 max-h-[220px] overflow-y-auto pr-1"></div>
        </div>

        <!-- PDF Extract Section (Optional - Added as requested in UI Style) -->
        <div class="border border-emerald-900/40 rounded-lg p-3 bg-emerald-950/20 space-y-2">
            <label class="block text-xs font-bold text-emerald-400 flex items-center gap-1">📄 PDF မှ စာသားထုတ်ယူရန် (Optional)</label>
            <input type="file" id="pdfInput" accept=".pdf" class="w-full text-xs text-gray-400 file:mr-2 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:bg-gray-700 file:text-white hover:file:bg-gray-650">
            <button id="btnExtractPdf" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs py-2 rounded font-bold transition flex items-center justify-center gap-1">
                ⚡ PDF မှ စာသားများကို ဆွဲထုတ်မည်
            </button>
        </div>

        <!-- သီးသန့်ခွဲထုတ်ထားတဲ့ Dynamic Editor Section -->
        <div id="activeEditorSection" class="hidden bg-gray-850 p-4 rounded-xl border border-gray-700 space-y-3 mt-4">
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1">အခန်းခေါင်းစဉ် (Chapter Title)</label>
                <input type="text" id="activeChTitle" placeholder="အခန်းခေါင်းစဉ်" class="w-full p-2 bg-gray-950 rounded text-sm text-white border border-gray-700 focus:outline-emerald-500 font-medium">
            </div>
            
            <button id="btnClearContent" class="w-full bg-rose-950/50 hover:bg-rose-950 border border-rose-800 text-rose-300 text-xs py-2 rounded font-bold transition">
                🧹 စာသားအားလုံးဖျက်ရန် (Clear All Content)
            </button>

            <div class="space-y-1">
                <label class="block text-xs font-bold text-gray-400">အခန်းတွင်းစာသား (Chapter Content)</label>
                <!-- Quill Global Editor Container -->
                <div id="global-quill-editor" class="w-full"></div>
            </div>
        </div>

        <!-- Action Button -->
        <button id="btnGenerate" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2 mt-4 text-sm tracking-wide">
            💾 ePub ဖိုင် ထုတ်ယူမည်
        </button>

    </div>

    <!-- Quill Rich Text Editor Script Dependency -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="app.js"></script>
</body>
</html>
