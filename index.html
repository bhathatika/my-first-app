<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web ePub Creator Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.7.0/tinymce.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap');
        body { font-family: 'Padauk', sans-serif; transition: background-color 0.3s, color 0.3s; }
        
        /* 🔥 iPad Layout ပျက်ခြင်းမှ ကာကွယ်ရန် တင်းကျပ်သော Custom Style များ */
        .tox-tinymce { 
            border-radius: 0.5rem !important; 
            border: 1px solid #334155 !important; 
            width: 100% !important;
            min-height: 350px !important;
            transition: border-color 0.3s;
        }
        #editor {
            width: 100% !important;
            min-height: 350px !important;
            background-color: #1e293b;
            color: #f1f5f9;
            border-radius: 0.5rem;
            padding: 12px;
        }

        /* 🌙 Night Mode (Pure Black) Class အမည်းရောင်အတွက် Custom Variables */
        body.night-mode {
            background-color: #030712 !important;
        }
        body.night-mode .bg-slate-800 {
            background-color: #111827 !important;
            border-color: #1f2937 !important;
        }
        body.night-mode .bg-slate-800\/60 {
            background-color: rgba(17, 24, 39, 0.6) !important;
            border-color: rgba(31, 41, 55, 0.6) !important;
        }
        body.night-mode .bg-slate-800\/40 {
            background-color: rgba(17, 24, 39, 0.4) !important;
            border-color: rgba(31, 41, 55, 0.4) !important;
        }
        body.night-mode input, body.night-mode p, body.night-mode label {
            transition: background-color 0.3s, border-color 0.3s;
        }
        body.night-mode input[type="text"] {
            background-color: #030712 !important;
            border-color: #374151 !important;
        }
        body.night-mode .tox-tinymce {
            border-color: #374151 !important;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

    <div id="auth-screen" class="max-w-md mx-auto px-4 pt-24 hidden">
        <div class="bg-slate-800 rounded-2xl p-6 border border-slate-700/80 shadow-2xl space-y-6">
            
            <div class="text-center space-y-2">
                <div class="inline-flex bg-amber-500/10 p-4 rounded-full text-amber-400 text-3xl mb-1">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-100">Web ePub Creator Pro</h2>
                <p id="lang-auth-subtitle" class="text-sm text-slate-400">ဆက်လက်အသုံးပြုရန် အကောင့်ဝင်ပေးပါ</p>
            </div>

            <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
                <button id="tab-login" onclick="switchAuthTab('login')" class="w-full text-sm font-medium py-2.5 rounded-lg bg-amber-500 text-slate-950 transition">Sign In</button>
                <button id="tab-register" onclick="switchAuthTab('register')" class="w-full text-sm font-medium py-2.5 rounded-lg text-slate-400 hover:text-slate-200 transition">Sign Up</button>
            </div>

            <div class="space-y-4">
                <div>
                    <label id="lang-auth-email" class="block text-xs font-medium text-slate-400 mb-1.5">အီးမေးလ် (Email Address)</label>
                    <input type="email" id="auth-email" placeholder="example@email.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 transition shadow-inner">
                </div>
                <div>
                    <label id="lang-auth-password" class="block text-xs font-medium text-slate-400 mb-1.5">စကားဝှက် (Password)</label>
                    <input type="password" id="auth-password" placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 transition shadow-inner">
                </div>
                
                <button id="auth-submit-btn" onclick="submitAuthForm()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-lg text-sm transition active:scale-95 shadow-lg shadow-amber-950/20">
                    အကောင့်ဝင်မည် (Sign In)
                </button>
            </div>
            
            <div class="text-center">
                <span id="lang-premium-badge" class="text-xs text-amber-400/60 font-medium">👑 Premium စနစ်ဖြင့် အသုံးပြုနိုင်ပါပြီ</span>
            </div>
        </div>
    </div>


    <div id="main-app-screen" class="max-w-xl mx-auto px-4 pt-6 hidden">
        
        <input type="file" id="hidden-editor-image-picker" accept="image/*" multiple class="hidden" onchange="handleInlineImageUpload(event)">
        
        <div class="flex flex-col gap-4 mb-6 pb-4 border-b border-slate-800">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-amber-400 flex items-center gap-2">
                    <i class="fa-solid fa-book-open"></i> Web ePub Creator Pro
                </h1>
                
                <div class="flex items-center gap-2">
                    <button onclick="toggleLanguage()" id="lang-btn" class="bg-slate-800 hover:bg-slate-700 text-sky-400 text-xs px-3 py-1.5 rounded-lg border border-slate-700 transition font-medium active:scale-95 flex items-center gap-1">
                        <i class="fa-solid fa-earth-asia"></i> <span id="lang-btn-text">English</span>
                    </button>
                    <button onclick="toggleNightMode()" id="night-mode-btn" class="bg-slate-800 hover:bg-slate-700 text-amber-400 text-xs px-3 py-1.5 rounded-lg border border-slate-700 transition font-medium active:scale-95 flex items-center gap-1">
                        <i id="night-mode-icon" class="fa-solid fa-moon"></i> <span id="night-mode-text">Night Mode</span>
                    </button>
                    <button onclick="handleSignOut()" id="lang-signout-btn" class="bg-slate-800 hover:bg-slate-700 text-rose-400 hover:text-rose-300 text-xs px-3 py-1.5 rounded-lg border border-slate-700 transition font-medium active:scale-95 flex items-center gap-1">
                        <i class="fa-solid fa-right-from-bracket"></i> <span>ထွက်မည်</span>
                    </button>
                </div>
            </div>

            <div class="flex justify-between items-center bg-slate-800/40 px-3 py-2 rounded-lg border border-slate-800/60">
                <span id="user-display-email" class="text-xs text-slate-400 flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-user text-emerald-400 text-sm"></i> loading...
                </span>
                <span class="bg-amber-500/20 text-amber-300 text-xs px-2.5 py-1 rounded-full border border-amber-500/30 font-medium flex items-center gap-1">
                    <i class="fa-solid fa-crown text-[10px]"></i> Premium
                </span>
            </div>
        </div>

        <div class="bg-slate-800 rounded-xl p-4 border border-slate-700/60 shadow-xl mb-6">
            <h2 id="lang-backup-title" class="text-sm font-semibold text-slate-400 mb-3 flex items-center gap-1.5">
                <i class="fa-solid fa-database text-amber-400"></i> စာအုပ် BACKUP စီမံခန့်ခွဲမှု
            </h2>
            <div class="grid grid-cols-1 gap-2.5">
                <button onclick="exportToBackupFile()" id="lang-backup-export" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 py-3 px-4 rounded-lg flex items-center justify-center gap-2 font-medium transition active:scale-95 border border-slate-600">
                    <i class="fa-solid fa-file-export text-emerald-400"></i> လက်ရှိစာအုပ်ကို ဖိုင်သိမ်းဆည်းမည် (Backup)
                </button>
                
                <label id="lang-backup-import" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 py-3 px-4 rounded-lg flex items-center justify-center gap-2 font-medium transition active:scale-95 border border-slate-600 cursor-pointer text-center">
                    <i class="fa-solid fa-file-import text-sky-400"></i> <span>စာအုပ်ဖောင်း ပြန်တင်မည် (Load Backup)</span>
                    <input type="file" id="backup-upload" accept=".json" onchange="loadFromBackupFile(event)" class="hidden">
                </label>
                
                <button onclick="resetAllData()" id="lang-backup-reset" class="w-full bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 py-3 px-4 rounded-lg flex items-center justify-center gap-2 font-medium transition active:scale-95 border border-rose-800/50">
                    <i class="fa-solid fa-trash-can text-rose-400"></i> စာအုပ်အသစ်အတွက် အစကပြန်စမည် (Reset)
                </button>
            </div>
        </div>

        <div class="space-y-4 mb-6">
            <div>
                <label id="lang-meta-title" class="block text-sm font-medium text-slate-400 mb-1.5">စာအုပ်အမည် (Book Title)</label>
                <input type="text" id="book-title" oninput="saveCurrentBookState()" placeholder="သူမ... ဖြစ်တည်မှု အပိုင်းအစများ" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 transition shadow-inner">
            </div>
            <div>
                <label id="lang-meta-author" class="block text-sm font-medium text-slate-400 mb-1.5">စာရေးဆရာ (Author)</label>
                <input type="text" id="author" oninput="saveCurrentBookState()" placeholder="သဘောတရား ဆရာလေးတစ်ရွာ" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 transition shadow-inner">
            </div>
            
            <div>
                <label id="lang-meta-cover" class="block text-sm font-medium text-slate-400 mb-1.5">မျက်နှာဖုံးပုံ (Cover Image)</label>
                <div class="flex items-center gap-3 bg-slate-800 border border-slate-700 rounded-lg p-2">
                    <label id="lang-cover-btn" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-md cursor-pointer text-sm font-medium border border-slate-600 transition active:scale-95">
                        <span>Choose File</span>
                        <input type="file" id="cover-upload" accept="image/*" onchange="handleCoverUpload(event)" class="hidden">
                    </label>
                    <span id="cover-status" class="text-sm text-slate-400 truncate">No file selected</span>
                </div>
                <div id="cover-preview-box" class="mt-2 hidden">
                    <img id="cover-preview" src="" class="w-24 h-auto rounded border border-slate-600 shadow-md">
                </div>
            </div>
        </div>

        <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4 mb-6">
            <label id="lang-chap-title" class="block text-sm font-medium text-slate-400 mb-3">အခန်းများ (Chapters)</label>
            <button onclick="addNewChapter()" id="lang-chap-add-btn" class="w-full bg-sky-600 hover:bg-sky-500 text-white py-3 rounded-lg font-medium flex items-center justify-center gap-1.5 transition active:scale-95 mb-3 shadow-lg shadow-sky-950/20">
                <i class="fa-solid fa-plus"></i> <span>အခန်းတိုးမည် (Add Chapter)</span>
            </button>
            <div id="chapters-list" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
        </div>

        <div id="editor-section" class="space-y-4 hidden">
            <div>
                <label id="lang-editor-chaptitle" class="block text-sm font-medium text-slate-400 mb-1.5">အခန်းခေါင်းစဉ် (Chapter Title)</label>
                <input type="text" id="chapter-title" oninput="updateChapterTitle()" placeholder="အခန်းခေါင်းစဉ် ရိုက်ပါ..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 transition shadow-inner">
            </div>
            <div class="w-full block min-h-[350px]">
                <label id="lang-editor-content" class="block text-sm font-medium text-slate-400 mb-1.5">အခန်းတွင်းစာသား (Chapter Content)</label>
                <textarea id="editor" class="w-full"></textarea>
            </div>
        </div>

        <div class="mt-6">
            <button onclick="generateEPUB()" id="lang-download-btn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-4 rounded-xl flex items-center justify-center gap-2 text-lg shadow-lg shadow-amber-950/30 transition active:scale-98">
                <i class="fa-solid fa-download text-xl"></i> <span>ePub ဖိုင် ထုတ်ယူမည်</span>
            </button>
        </div>

    </div>

    <script>
        let bookChapters = [];
        let currentChapterIndex = 0;
        let coverBase64 = "";
        let authMode = "login";
        let currentLang = "my"; // Default Language

        const DB_NAME = 'WebEpubCreatorDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'bookState';

        // ਬਹੁ-ਭਾਸ਼ਾਈ ਸ਼ਬਦਕੋਸ਼ Dictionary
        const languages = {
            my: {
                authSubtitle: "ဆက်လက်အသုံးပြုရန် အကောင့်ဝင်ပေးပါ",
                authEmail: "အီးမေးလ် (Email Address)",
                authPassword: "စကားဝှက် (Password)",
                authSignIn: "အကောင့်ဝင်မည် (Sign In)",
                authSignUp: "အကောင့်သစ်ဖွင့်မည် (Sign Up)",
                premiumBadge: "👑 Premium စနစ်ဖြင့် အသုံးပြုနိုင်ပါပြီ",
                signout: "ထွက်မည်",
                backupTitle: "စာအုပ် BACKUP စီမံခန့်ခွဲမှု",
                backupExport: "လက်ရှိစာအုပ်ကို ဖိုင်သိမ်းဆည်းမည် (Backup)",
                backupImport: "စာအုပ်ဖောင်း ပြန်တင်မည် (Load Backup)",
                backupReset: "စာအုပ်အသစ်အတွက် အစကပြန်စမည် (Reset)",
                metaTitle: "စာအုပ်အမည် (Book Title)",
                metaAuthor: "စာရေးဆရာ (Author)",
                metaCover: "မျက်နှာဖုံးပုံ (Cover Image)",
                chooseFile: "Choose File",
                chapters: "အခန်းများ (Chapters)",
                addChapter: "အခန်းတိုးမည် (Add Chapter)",
                editorChapTitle: "အခန်းခေါင်းစဉ် (Chapter Title)",
                editorContent: "အခန်းတွင်းစာသား (Chapter Content)",
                downloadBtn: "ePub ဖိုင် ထုတ်ယူမည်",
                noFile: "ရွေးချယ်ထားသော ဖိုင်မရှိပါ",
                coverLoaded: "မျက်နှာဖုံး တင်ပြီး ✓",
                alertNoChapters: "⚠️ သတိပေးချက်: အခန်းမရှိသေးပါ။ '+ အခန်းတိုးမည်' ကို နှိပ်ပေးပါ။",
                alertConfirmDelete: "ဒီအခန်းကို ဖျက်ပစ်ရန် သေချာပါသလား?",
                alertConfirmReset: "⚠️ သတိပေးချက်: စာအုပ်ဒေတာအားလုံးကို ဖျက်ပစ်ပြီး အစက ပြန်စမှာ သေချာပါသလား?",
                untitledChapter: "ခေါင်းစဉ်မရှိသေးသော အခန်း"
            },
            en: {
                authSubtitle: "Please sign in to continue",
                authEmail: "Email Address",
                authPassword: "Password",
                authSignIn: "Sign In",
                authSignUp: "Sign Up",
                premiumBadge: "👑 Premium Mode Active",
                signout: "Sign Out",
                backupTitle: "Book Backup Management",
                backupExport: "Export Book Data (Backup)",
                backupImport: "Import Book Data (Load Backup)",
                backupReset: "Reset and Start New Book",
                metaTitle: "Book Title",
                metaAuthor: "Author",
                metaCover: "Cover Image",
                chooseFile: "Choose File",
                chapters: "Chapters",
                addChapter: "Add New Chapter",
                editorChapTitle: "Chapter Title",
                editorContent: "Chapter Content",
                downloadBtn: "Generate & Download ePub",
                noFile: "No file selected",
                coverLoaded: "Cover Loaded ✓",
                alertNoChapters: "⚠️ Warning: No chapters found. Please click '+ Add New Chapter' first.",
                alertConfirmDelete: "Are you sure you want to delete this chapter?",
                alertConfirmReset: "⚠️ Warning: Are you sure you want to clear all data and reset?",
                untitledChapter: "Untitled Chapter"
            }
        };

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        // 🌐 LANGUAGE SWITCHER FUNCTION
        function toggleLanguage() {
            currentLang = (currentLang === "my") ? "en" : "my";
            localStorage.setItem('epub_language', currentLang);
            applyLanguage();
        }

        function applyLanguage() {
            const l = languages[currentLang];
            
            // Apply texts
            document.getElementById('lang-btn-text').innerText = (currentLang === "my") ? "English" : "မြန်မာ";
            document.getElementById('lang-auth-subtitle').innerText = l.authSubtitle;
            document.getElementById('lang-auth-email').innerText = l.authEmail;
            document.getElementById('lang-auth-password').innerText = l.authPassword;
            document.getElementById('lang-premium-badge').innerText = l.premiumBadge;
            document.getElementById('lang-signout-btn').querySelector('span').innerText = l.signout;
            document.getElementById('lang-backup-title').innerHTML = `<i class="fa-solid fa-database text-amber-400"></i> ${l.backupTitle}`;
            document.getElementById('lang-backup-export').innerHTML = `<i class="fa-solid fa-file-export text-emerald-400"></i> ${l.backupExport}`;
            document.getElementById('lang-backup-import').querySelector('span').innerText = l.backupImport;
            document.getElementById('lang-backup-reset').innerHTML = `<i class="fa-solid fa-trash-can text-rose-400"></i> ${l.backupReset}`;
            document.getElementById('lang-meta-title').innerText = l.metaTitle;
            document.getElementById('lang-meta-author').innerText = l.metaAuthor;
            document.getElementById('lang-meta-cover').innerText = l.metaCover;
            document.getElementById('lang-cover-btn').querySelector('span').innerText = l.chooseFile;
            document.getElementById('lang-chap-title').innerText = l.chapters;
            document.getElementById('lang-chap-add-btn').querySelector('span').innerText = l.addChapter;
            document.getElementById('lang-editor-chaptitle').innerText = l.editorChapTitle;
            document.getElementById('lang-editor-content').innerText = l.editorContent;
            document.getElementById('lang-download-btn').innerHTML = `<i class="fa-solid fa-download text-xl"></i> <span>${l.downloadBtn}</span>`;
            
            // Adjust Auth Submit Button text
            const submitBtn = document.getElementById('auth-submit-btn');
            if (authMode === 'login') {
                submitBtn.innerText = l.authSignIn;
            } else {
                submitBtn.innerText = l.authSignUp;
            }

            // Adjust Cover Status text
            const statusBox = document.getElementById('cover-status');
            if (coverBase64) {
                statusBox.innerText = l.coverLoaded;
            } else {
                statusBox.innerText = l.noFile;
            }

            renderChaptersList();
        }

        // 🌙 NIGHT MODE FUNCTION
        function toggleNightMode() {
            const body = document.body;
            const icon = document.getElementById('night-mode-icon');
            const text = document.getElementById('night-mode-text');
            
            body.classList.toggle('night-mode');
            
            if (body.classList.contains('night-mode')) {
                localStorage.setItem('epub_night_mode', 'enabled');
                icon.className = "fa-solid fa-sun";
                text.innerText = "Normal Mode";
            } else {
                localStorage.setItem('epub_night_mode', 'disabled');
                icon.className = "fa-solid fa-moon";
                text.innerText = "Night Mode";
            }
        }

        function applySavedNightMode() {
            const nightModeSetting = localStorage.getItem('epub_night_mode');
            const icon = document.getElementById('night-mode-icon');
            const text = document.getElementById('night-mode-text');
            
            if (nightModeSetting === 'enabled') {
                document.body.classList.add('night-mode');
                if(icon && text) {
                    icon.className = "fa-solid fa-sun";
                    text.innerText = "Normal Mode";
                }
            }
        }

        // 🔐 AUTHENTICATION SYSTEM
        function checkUserAuth() {
            const loggedInUser = localStorage.getItem('epub_user_session');
            
            // Load language configuration
            const savedLang = localStorage.getItem('epub_language');
            if (savedLang) currentLang = savedLang;

            if (loggedInUser) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-app-screen').classList.remove('hidden');
                document.getElementById('user-display-email').innerHTML = `<i class="fa-solid fa-circle-user text-emerald-400 text-sm"></i> ${loggedInUser}`;
                initTinyMCE();
                loadBookDataFromDB();
                applySavedNightMode();
                applyLanguage(); 
            } else {
                document.getElementById('main-app-screen').classList.add('hidden');
                document.getElementById('auth-screen').classList.remove('hidden');
                applyLanguage();
            }
        }

        function switchAuthTab(mode) {
            authMode = mode;
            const loginTab = document.getElementById('tab-login');
            const registerTab = document.getElementById('tab-register');
            const l = languages[currentLang];

            if (mode === 'login') {
                loginTab.className = "w-full text-sm font-medium py-2.5 rounded-lg bg-amber-500 text-slate-950 transition";
                registerTab.className = "w-full text-sm font-medium py-2.5 rounded-lg text-slate-400 hover:text-slate-200 transition";
                document.getElementById('auth-submit-btn').innerText = l.authSignIn;
            } else {
                registerTab.className = "w-full text-sm font-medium py-2.5 rounded-lg bg-amber-500 text-slate-950 transition";
                loginTab.className = "w-full text-sm font-medium py-2.5 rounded-lg text-slate-400 hover:text-slate-200 transition";
                document.getElementById('auth-submit-btn').innerText = l.authSignUp;
            }
        }

        function submitAuthForm() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();

            if (!email || !password) {
                alert(currentLang === 'my' ? "⚠️ ကျေးဇူးပြု၍ အီးမေးလ်နှင့် စကားဝှက်ကို ရိုက်ထည့်ပေးပါဗျာ।" : "⚠️ Please enter both email and password.");
                return;
            }

            if (authMode === 'login') {
                localStorage.setItem('epub_user_session', email);
                checkUserAuth();
            } else {
                alert(currentLang === 'my' ? "🎉 အကောင့်သစ်ကို အောင်မြင်စွာ တည်ဆောက်ပြီးပါပြီ။ Sign In ဝင်နိုင်ပါပြီ।" : "🎉 Account created successfully. You can now Sign In.");
                switchAuthTab('login');
            }
        }

        function handleSignOut() {
            const confirmMsg = currentLang === 'my' ? "အကောင့်ထဲမှ ထွက်ရန် သေချာပါသလား?" : "Are you sure you want to sign out?";
            if (confirm(confirmMsg)) {
                localStorage.removeItem('epub_user_session');
                if (tinymce.activeEditor) {
                    tinymce.remove('#editor');
                }
                location.reload();
            }
        }

        // TinyMCE Init Function
        function initTinyMCE() {
            if (tinymce.get('editor')) return;
            
            tinymce.init({
                selector: '#editor',
                height: 380,
                width: '100%',
                menubar: false,
                skin: 'oxide-dark',
                content_css: 'dark',
                plugins: 'lists link charmap',
                toolbar: 'bold italic underline | numlist bullist | custom_image link | removeformat',
                autoresize_bottom_margin: 10,
                
                setup: function(editor) {
                    editor.ui.registry.addButton('custom_image', {
                        icon: 'image',
                        tooltip: 'Insert Images From Gallery',
                        onAction: function () {
                            document.getElementById('hidden-editor-image-picker').click();
                        }
                    });

                    editor.on('NodeChange keyup change', function() {
                        if (bookChapters[currentChapterIndex]) {
                            bookChapters[currentChapterIndex].content = editor.getContent();
                            saveCurrentBookState();
                        }
                    });
                }
            });
        }

        function handleInlineImageUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const base64Data = e.target.result;
                    if (tinymce.activeEditor) {
                        tinymce.activeEditor.insertContent(`<img src="${base64Data}" alt="${file.name}" style="max-w-full; height:auto; display:block; margin:12px auto;"/>`);
                        tinymce.activeEditor.fire('change');
                    }
                };
                reader.readAsDataURL(file);
            });
            document.getElementById('hidden-editor-image-picker').value = "";
        }

        // App Book Data Load
        async function loadBookDataFromDB() {
            try {
                const db = await initDB();
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const getRequest = store.get('currentBook');

                getRequest.onsuccess = function() {
                    const savedData = getRequest.result;
                    if (savedData) {
                        document.getElementById('book-title').value = savedData.title || "";
                        document.getElementById('author').value = savedData.author || "";
                        bookChapters = savedData.chapters || [];
                        currentChapterIndex = savedData.currentIndex || 0;
                        coverBase64 = savedData.cover || "";

                        const l = languages[currentLang];
                        if (coverBase64) {
                            document.getElementById('cover-status').innerText = l.coverLoaded;
                            document.getElementById('cover-preview').src = coverBase64;
                            document.getElementById('cover-preview-box').classList.remove('hidden');
                        }
                        
                        renderChaptersList();
                        if (bookChapters.length > 0) {
                            selectChapter(currentChapterIndex);
                        }
                    }
                };
            } catch (err) {
                console.error("DB Load Error:", err);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            checkUserAuth();
        });

        // Auto Save
        async function saveCurrentBookState() {
            try {
                const db = await initDB();
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);

                if (bookChapters[currentChapterIndex] && tinymce.activeEditor) {
                    bookChapters[currentChapterIndex].content = tinymce.activeEditor.getContent();
                }

                const state = {
                    title: document.getElementById('book-title').value,
                    author: document.getElementById('author').value,
                    cover: coverBase64,
                    chapters: bookChapters,
                    currentIndex: currentChapterIndex
                };

                store.put(state, 'currentBook');
            } catch (error) {
                console.error("Auto-save failed:", error);
            }
        }

        // Cover Handler
        function handleCoverUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                coverBase64 = event.target.result;
                document.getElementById('cover-status').innerText = languages[currentLang].coverLoaded;
                document.getElementById('cover-preview').src = coverBase64;
                document.getElementById('cover-preview-box').classList.remove('hidden');
                saveCurrentBookState();
            };
            reader.readAsDataURL(file);
        }

        // Chapters UI rendering
        function renderChaptersList() {
            const listContainer = document.getElementById('chapters-list');
            if(!listContainer) return;
            listContainer.innerHTML = "";

            const l = languages[currentLang];

            bookChapters.forEach((chap, idx) => {
                const div = document.createElement('div');
                div.className = `flex justify-between items-center p-2.5 rounded-lg border transition text-sm cursor-pointer ${idx === currentChapterIndex ? 'bg-slate-700 border-sky-500 text-sky-300' : 'bg-slate-800/40 border-slate-700 text-slate-300 hover:bg-slate-700/50'}`;
                div.setAttribute('onclick', `selectChapter(${idx})`);

                const defTitle = currentLang === 'my' ? `အခန်း (${idx+1})` : `${l.untitledChapter} ${idx+1}`;
                div.innerHTML = `
                    <span class="truncate font-medium flex items-center gap-2">
                        <i class="fa-solid fa-file-lines opacity-60"></i> ${chap.title || defTitle}
                    </span>
                    <button onclick="deleteChapter(${idx}, event)" class="text-slate-500 hover:text-rose-400 p-1 transition">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
                listContainer.appendChild(div);
            });
        }

        function addNewChapter() {
            const newIndex = bookChapters.length + 1;
            const titlePrefix = currentLang === 'my' ? `အခန်း (${newIndex})` : `Chapter (${newIndex})`;
            bookChapters.push({
                title: titlePrefix,
                content: ""
            });
            currentChapterIndex = bookChapters.length - 1;
            renderChaptersList();
            selectChapter(currentChapterIndex);
            saveCurrentBookState();
        }

        function selectChapter(idx) {
            if (idx < 0 || idx >= bookChapters.length) return;
            currentChapterIndex = idx;
            renderChaptersList();

            document.getElementById('editor-section').classList.remove('hidden');
            document.getElementById('chapter-title').value = bookChapters[idx].title;
            
            if (tinymce.activeEditor) {
                tinymce.activeEditor.setContent(bookChapters[idx].content || "");
            } else {
                setTimeout(() => { if(tinymce.activeEditor) tinymce.activeEditor.setContent(bookChapters[idx].content || ""); }, 300);
            }
        }

        function updateChapterTitle() {
            const titleVal = document.getElementById('chapter-title').value;
            if (bookChapters[currentChapterIndex]) {
                bookChapters[currentChapterIndex].title = titleVal;
                renderChaptersList();
                saveCurrentBookState();
            }
        }

        function deleteChapter(idx, event) {
            event.stopPropagation();
            if (!confirm(languages[currentLang].alertConfirmDelete)) return;

            bookChapters.splice(idx, 1);
            if (currentChapterIndex >= bookChapters.length) {
                currentChapterIndex = Math.max(0, bookChapters.length - 1);
            }

            renderChaptersList();
            if (bookChapters.length > 0) {
                selectChapter(currentChapterIndex);
            } else {
                document.getElementById('editor-section').classList.add('hidden');
            }
            saveCurrentBookState();
        }

        // Reset Data
        async function resetAllData() {
            if (!confirm(languages[currentLang].alertConfirmReset)) return;
            try {
                const db = await initDB();
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                await store.delete('currentBook');
                location.reload();
            } catch (err) {
                alert("Reset Error");
            }
        }

        // Export Backup JSON
        async function exportToBackupFile() {
            try {
                await saveCurrentBookState();
                const db = await initDB();
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const getRequest = store.get('currentBook');
                
                getRequest.onsuccess = function() {
                    const state = getRequest.result;
                    if (!state) return;
                    const jsonString = JSON.stringify(state);
                    const blob = new Blob([jsonString], { type: "application/json" });
                    const filename = (state.title || "My_Novel").replace(/\s+/g, '_') + "_backup.json";

                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(downloadUrl);
                    }, 1000);
                };
            } catch (error) {
                alert("Backup Error: " + error.message);
            }
        }

        // Load Backup JSON
        function loadFromBackupFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(event) {
                try {
                    const state = JSON.parse(event.target.result);
                    const db = await initDB();
                    const transaction = db.transaction([STORE_NAME], 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);
                    await store.put(state, 'currentBook');
                    location.reload(); 
                } catch (error) {
                    alert("JSON File Error");
                }
            };
            reader.readAsText(file);
        }

        // Base64 to Blob Parser
        function base64ToBlob(base64Str) {
            if (!base64Str || typeof base64Str !== 'string') return null;
            let contentType = "image/jpeg";
            let rawData = base64Str;

            if (base64Str.startsWith('data:image')) {
                const parts = base64Str.split(';base64,');
                contentType = parts[0].split(':')[1];
                rawData = parts[1];
            } else { return null; }

            try {
                const raw = window.atob(rawData);
                const rawLength = raw.length;
                const uInt8Array = new Uint8Array(rawLength);
                for (let i = 0; i < rawLength; ++i) {
                    uInt8Array[i] = raw.charCodeAt(i);
                }
                return new Blob([uInt8Array], { type: contentType });
            } catch (e) { return null; }
        }

        // CORE EPUB GENERATOR
        async function generateEPUB() {
            await saveCurrentBookState();
            const title = document.getElementById('book-title').value || "Untitled Book";
            const author = document.getElementById('author').value || "Unknown Author";
            
            if(!bookChapters || bookChapters.length === 0) {
                alert(languages[currentLang].alertNoChapters);
                return;
            }

            const zip = new JSZip();
            zip.file("mimetype", "application/epub+zip", { compression: "STORE" });
            
            const containerXml = `<?xml version="1.0" encoding="UTF-8"?>
            <container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
                <rootfiles>
                    <rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/>
                </rootfiles>
            </container>`;
            zip.file("META-INF/container.xml", containerXml);

            let manifestItems = "";
            let spineItems = "";
            let imageCounter = 1;

            for (let index = 0; index < bookChapters.length; index++) {
                let chap = bookChapters[index];
                let htmlString = chap.content || "";
                htmlString = htmlString.replace(/&nbsp;/g, '&#160;');

                const parser = new DOMParser();
                const doc = parser.parseFromString(`<div>${htmlString}</div>`, 'text/html');
                const container = doc.body.firstChild;

                const brs = container.querySelectorAll('br');
                brs.forEach(br => {
                    const pBr = doc.createElement('p');
                    pBr.innerHTML = '&#160;';
                    br.replaceWith(pBr);
                });

                const imgs = container.querySelectorAll('img');
                for (let img of imgs) {
                    const src = img.getAttribute('src');
                    if (src && src.startsWith('data:image')) {
                        let ext = "jpg";
                        let mediaType = "image/jpeg";
                        if (src.includes("image/png")) { ext = "png"; mediaType = "image/png"; }
                        else if (src.includes("image/gif")) { ext = "gif"; mediaType = "image/gif"; }

                        const filename = `image_${imageCounter}.${ext}`;
                        const imgBlob = base64ToBlob(src);
                        
                        if (imgBlob) {
                            zip.file(`OEBPS/images/${filename}`, imgBlob);
                            manifestItems += `<item id="img_${imageCounter}" href="images/${filename}" media-type="${mediaType}"/>\n`;
                            img.setAttribute('src', `images/${filename}`);
                            if (!img.getAttribute('alt')) img.setAttribute('alt', `photo_${imageCounter}`);
                            imageCounter++;
                        } else { img.remove(); }
                    }
                }

                const serializer = new XMLSerializer();
                let finalizedXhtmlContent = serializer.serializeToString(container);
                finalizedXhtmlContent = finalizedXhtmlContent.replace(/^<div[^>]*>/, '').replace(/<\/div>$/, '');

                const chapHtml = `<?xml version="1.0" encoding="utf-8"?>
                <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
                <html xmlns="http://www.w3.org/1999/xhtml">
                <head>
                    <title>${chap.title}</title>
                    <style>
                        body { padding: 20px; font-family: sans-serif; line-height: 1.6; color: #111111; background-color: #ffffff; }
                        img { max-width: 100%; height: auto; display: block; margin: 15px auto; border-radius: 6px; }
                        h1 { font-size: 1.5em; text-align: center; margin-bottom: 20px; color: #1e2640; }
                        p { margin-bottom: 0.8em; text-align: justify; line-height: 1.6; }
                    </style>
                </head>
                <body>
                    <h1>${chap.title}</h1>
                    <div>${finalizedXhtmlContent}</div>
                </body>
                </html>`;
                
                zip.file(`OEBPS/chapter_${index + 1}.xhtml`, chapHtml);
                manifestItems += `<item id="chap_${index + 1}" href="chapter_${index + 1}.xhtml" media-type="application/xhtml+xml"/>\n`;
                spineItems += `<itemref idref="chap_${index + 1}"/>\n`;
            }

            if (coverBase64) {
                let coverExt = "jpg";
                let coverMime = "image/jpeg";
                if (coverBase64.includes("image/png")) { coverExt = "png"; coverMime = "image/png"; }
                const coverBlob = base64ToBlob(coverBase64);
                if (coverBlob) {
                    zip.file(`OEBPS/images/cover.${coverExt}`, coverBlob);
                    manifestItems += `<item id="cover-img" href="images/cover.${coverExt}" media-type="${coverMime}"/>\n`;
                }
            }

            const opfXml = `<?xml version="1.0" encoding="UTF-8"?>
            <package xmlns="http://www.idpf.org/2007/opf" unique-identifier="bookid" version="2.0">
                <metadata xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:opf="http://www.idpf.org/2007/opf">
                    <dc:title>${title}</dc:title>
                    <dc:creator opf:role="aut">${author}</dc:creator>
                    <dc:language>${currentLang}</dc:language>
                    <dc:identifier id="bookid">urn:uuid:${Date.now()}</dc:identifier>
                     ${coverBase64 ? '<meta name="cover" content="cover-img"/>' : ''}
                </metadata>
                <manifest>
                    <item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>
                    ${manifestItems}
                </manifest>
                <spine toc="ncx">
                    ${spineItems}
                </spine>
            </package>`;
            zip.file("OEBPS/content.opf", opfXml);

            let ncxNav = "";
            bookChapters.forEach((chap, index) => {
                ncxNav += `<navPoint id="nav_${index + 1}" playOrder="${index + 1}">
                    <navLabel><text>${chap.title}</text></navLabel>
                    <content src="chapter_${index + 1}.xhtml"/>
                </navPoint>\n`;
            });

            const ncxXml = `<?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE ncx PUBLIC "-//NISO//DTD ncx v2005-1//EN" "http://www.daisy.org/z3986/2005/ncx-2005-1.dtd">
            <ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1">
                <head>
                    <meta name="dtb:uid" content="urn:uuid:${Date.now()}"/>
                    <meta name="dtb:depth" content="1"/>
                </head>
                <docTitle><text>${title}</text></docTitle>
                <navMap>${ncxNav}</navMap>
            </ncx>`;
            zip.file("OEBPS/toc.ncx", ncxXml);

            // Downloader
            zip.generateAsync({ type: "blob", mimeType: "application/epub+zip" }).then(function (blob) {
                const filename = title.replace(/\s+/g, '_') + ".epub";
                const downloadUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => { 
                    document.body.removeChild(a); 
                    window.URL.revokeObjectURL(downloadUrl);
                }, 1000);
            }).catch(function (err) { alert("ePub Error: " + err.message); });
        }
    </script>
    <footer class="app-footer text-center text-xs text-slate-500 mt-8">
        <p>Developed with ❤️ by <span class="designer-name">Nanda</span></p>
    </footer>
</body>
